<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIC 2026 · HCMUT Technologia</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1c2230;
    --line: #2a3140;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #4c9aff;
    --ok: #3fb950;
    --warn: #d29922;
    --danger: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.45 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  input, select, button { font: inherit; color: inherit; }
  input[type=text], input[type=number], select {
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 9px;
  }
  input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent);
  }
  button {
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06101f; font-weight: 600; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  kbd {
    background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 0 5px; font-size: 11px; font-family: ui-monospace, monospace;
  }
  .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }

  /* --- thanh truy van --- */
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 10px 14px;
    transition: padding 0.15s ease;
  }
  header.collapsed {
    padding: 6px 14px;
  }
  header.collapsed .header-extra {
    display: none !important;
  }
  header.collapsed textarea#query {
    min-height: 32px !important;
    height: 32px !important;
    resize: none !important;
    padding: 5px 8px;
    line-height: 1.2;
    overflow: hidden;
  }
  .btn-toggle-hdr {
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border-radius: 5px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn-toggle-hdr:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 8px; }
  #query { flex: 1; min-width: 260px; }
  #ocr { width: 220px; }
  .label { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .chk { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; }
  #status { margin-left: auto; color: var(--muted); font-size: 12px; }
  #status.err { color: var(--danger); }

  /* --- than trang --- */
  main { flex: 1; display: flex; min-height: 0; }
  #results { flex: 1; overflow-y: auto; padding: 12px; }
  #grid {
    display: grid; gap: 8px;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
    .card {
    position: relative; background: var(--panel); border: 2px solid transparent;
    border-radius: 8px; overflow: hidden !important; cursor: pointer; box-sizing: border-box;
  }
  .seq-images {
    display: flex; gap: 2px; overflow: hidden !important; aspect-ratio: 16/9; width: 100%; background: #000;
    box-sizing: border-box;
  }
  .seq-images img {
    flex: 1 1 0; min-width: 0; height: 100%; object-fit: cover; cursor: pointer;
    border: 2px solid transparent; border-radius: 3px; box-sizing: border-box;
    transition: border-color 0.15s, opacity 0.15s;
  }
  .seq-images img:hover {
    filter: brightness(1.15);
  }
  .seq-images img.active-seq-frame {
    border-color: var(--accent) !important;
    outline: 1px solid var(--accent);
    outline-offset: -1px;
  }
  .card img:not(.seq-images img) {
    width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #000;
  }
  .card .meta {
    padding: 4px 6px; font-size: 11px; color: var(--muted);
    display: flex; justify-content: space-between; gap: 6px;
  }
  .card .meta b { color: var(--text); font-weight: 600; }
  .card.cursor { border-color: var(--accent); }
  .card.picked { border-color: var(--ok); }
  .card .rank {
    position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,.72);
    border-radius: 4px; padding: 1px 5px; font-size: 11px; font-family: ui-monospace, monospace;
  }
  .card .tick {
    position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--ok); color: #06101f; font-weight: 700; font-size: 12px;
    display: none; align-items: center; justify-content: center;
  }
  .card.picked .tick { display: flex; }

  /* --- textarea query --- */
  textarea#query {
    resize: vertical;
    min-height: 60px;
    max-height: 240px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13px;
    line-height: 1.4;
    overflow-y: auto;
    flex: 1;
    min-width: 260px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel-2);
    color: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea#query:focus {
    border-color: var(--accent);
    outline: none;
    box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
  }

  /* --- Splitter --- */
  #splitter {
    width: 6px;
    cursor: col-resize;
    background: var(--line);
    transition: background 0.15s;
    user-select: none;
    flex: 0 0 6px;
    z-index: 10;
  }
  #splitter:hover, #splitter.dragging {
    background: var(--accent);
  }

  /* --- panel chi tiet --- */
  #detail {
    width: 360px;
    min-width: 250px;
    max-width: 70vw;
    flex: 0 0 auto;
    background: var(--panel);
    border-left: 1px solid var(--line);
    overflow-y: auto;
    padding: 12px;
  }
  #detail img.big {
    width: 100%;
    height: auto;
    max-height: 60vh;
    object-fit: contain;
    border-radius: 8px;
    background: #000;
    display: block;
    margin: 0 auto;
  }
  #detail h3 { margin: 10px 0 4px; font-size: 13px; }
  #detail .kv { color: var(--muted); font-size: 12px; }
  #detail .sep { border-top: 1px solid var(--line); margin: 12px 0; }
  #neighbors { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
  #neighbors img {
    height: 46px; border-radius: 4px; border: 2px solid transparent; cursor: pointer; background: #000;
  }
  #neighbors img.here { border-color: var(--accent); }
  .ocrline { font-size: 12px; padding: 3px 0; border-bottom: 1px dotted var(--line); }
  .ocrline span { color: var(--muted); font-family: ui-monospace, monospace; }

  /* --- gio nop bai (1 dong gon) --- */
  footer {
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 4px 12px;
    min-height: 36px;
    display: flex;
    align-items: center;
  }
  .footer-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    overflow: hidden;
  }
  .footer-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    flex-shrink: 0;
    font-size: 12px;
  }
  #basket {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding: 2px 0;
    flex: 1 1 auto;
    align-items: center;
    min-height: 26px;
    scrollbar-width: thin;
  }
  .chip {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 11px;
    white-space: nowrap;
    font-family: ui-monospace, monospace;
    cursor: pointer;
    line-height: 1.2;
    flex-shrink: 0;
    transition: border-color 0.15s, background 0.15s;
  }
  .chip:hover {
    border-color: var(--danger);
    background: rgba(239, 68, 68, 0.1);
  }
  #count.full { color: var(--warn); font-weight: 700; }

  .hint { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>

<header>
  <div class="row">
    <textarea id="query" rows="3" placeholder="Câu truy vấn… (nhấn / để focus, Enter tìm, Shift+Enter xuống dòng)" autofocus></textarea>
    <span class="label">K</span><input type="number" id="k" value="1000" min="1" step="100" style="width:82px">
    <span class="label">top-N</span><input type="number" id="topn" value="100" min="1" max="100" style="width:70px">
    <button class="primary" id="btn-search">Search</button>
    <span id="status">đang kiểm tra…</span>
    <button type="button" id="btn-toggle-header" class="btn-toggle-hdr" title="Thu gọn / Mở rộng thanh tìm kiếm (Ctrl+H)">▲ Thu gọn</button>
  </div>
  <div class="row header-extra">
    <span class="label">OD filter</span>
    <input type="text" id="od-label" list="coco-classes" placeholder="Object (e.g. person)">
    <datalist id="coco-classes">
      <option value="airplane"><option value="apple"><option value="backpack"><option value="banana"><option value="baseball bat"><option value="baseball glove"><option value="bear"><option value="bed"><option value="bench"><option value="bicycle"><option value="bird"><option value="boat"><option value="book"><option value="bottle"><option value="bowl"><option value="broccoli"><option value="bus"><option value="cake"><option value="car"><option value="carrot"><option value="cat"><option value="cell phone"><option value="chair"><option value="clock"><option value="couch"><option value="cow"><option value="cup"><option value="dining table"><option value="dog"><option value="donut"><option value="elephant"><option value="fire hydrant"><option value="fork"><option value="frisbee"><option value="giraffe"><option value="hair drier"><option value="handbag"><option value="horse"><option value="hot dog"><option value="keyboard"><option value="kite"><option value="knife"><option value="laptop"><option value="microwave"><option value="motorcycle"><option value="mouse"><option value="orange"><option value="oven"><option value="parking meter"><option value="person"><option value="pizza"><option value="potted plant"><option value="refrigerator"><option value="remote"><option value="sandwich"><option value="scissors"><option value="sheep"><option value="sink"><option value="skateboard"><option value="skis"><option value="snowboard"><option value="spoon"><option value="sports ball"><option value="stop sign"><option value="suitcase"><option value="surfboard"><option value="teddy bear"><option value="tennis racket"><option value="tie"><option value="toaster"><option value="toilet"><option value="toothbrush"><option value="traffic light"><option value="train"><option value="truck"><option value="tv"><option value="umbrella"><option value="vase"><option value="wine glass"><option value="zebra">
    </datalist>
    <select id="od-color" style="width:90px">
      <option value="none">Màu (All)</option>
      <option value="red">Đỏ (Red)</option>
      <option value="orange">Cam (Orange)</option>
      <option value="yellow">Vàng (Yellow)</option>
      <option value="green">Xanh lá (Green)</option>
      <option value="blue">Xanh dương (Blue)</option>
      <option value="purple">Tím (Purple)</option>
      <option value="black">Đen (Black)</option>
      <option value="white">Trắng (White)</option>
      <option value="gray">Xám (Gray)</option>
    </select>
    <input type="number" id="od-count" value="1" min="1" style="width:70px" placeholder="Count">
    <button id="btn-add-od" style="padding: 2px 8px;">+ Thêm</button>
    <div id="od-tags" style="display: flex; gap: 4px; flex-wrap: wrap;"></div>
  </div>
  <div class="row header-extra">
    <span class="label">OCR filter</span>
    <input type="text" id="ocr" placeholder="chữ trên màn hình">
    <label class="chk"><input type="checkbox" id="ocr-phrase" checked> cả cụm</label>
    <span class="label">conf ≥</span>
    <input type="number" id="ocr-conf" value="0.3" min="0" max="1" step="0.05" style="width:70px">
    <span class="sep-v"></span>
    <span class="label">Task</span>
    <select id="task"><option value="kis">KIS</option><option value="qa">Q&amp;A</option><option value="trake">TRAKE</option></select>
    <input type="text" id="answer" placeholder="answer (Q&amp;A, ≤100 ký tự)" maxlength="100" style="width:260px; display:none">
    <span class="hint" style="margin-left:auto">
      <kbd>/</kbd> tìm · <kbd>↑↓←→</kbd> di chuyển · <kbd>Space</kbd> chọn ·
      <kbd>,</kbd><kbd>.</kbd> keyframe lân cận · <kbd>Ctrl+E</kbd> xuất
    </span>
  </div>
</header>

<main>
  <section id="results"><div class="empty">Nhập câu truy vấn rồi nhấn Search.</div></section>
  <div id="splitter" title="Kéo để thay đổi kích thước panel chi tiết"></div>
  <aside id="detail"><div class="empty">Chưa chọn keyframe.</div></aside>
</main>

<footer>
  <div class="footer-bar">
    <div class="footer-controls">
      <b>Giỏ nộp bài:</b>
      <span id="count" class="mono">0 / 100</span>
      <button id="btn-export" style="padding: 2px 8px; font-size: 11px;">Xuất CSV</button>
      <button id="btn-clear" style="padding: 2px 8px; font-size: 11px;">Xoá hết</button>
    </div>
    <div id="basket"></div>
    <span class="hint" id="export-note" style="white-space: nowrap; margin-left: auto;"></span>
  </div>
</footer>

<script src="/app.js?v=2"></script>
</body>
</html>
